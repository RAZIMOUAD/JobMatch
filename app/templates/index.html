<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMatch - Healthcare Job Search</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #10b981;
            --bg-dark: #0f172a;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --text-light: #f8fafc;
            --text-gray: #94a3b8;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Canvas 3D Background */
        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Logo */
        .logo {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            animation: fadeInDown 1s ease;
        }

        .tagline {
            font-size: 1.25rem;
            color: var(--text-gray);
            margin-bottom: 3rem;
            text-align: center;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        /* Search Container */
        .search-container {
            width: 100%;
            max-width: 700px;
            animation: fadeInUp 1s ease 0.4s backwards;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 1.5rem 4rem 1.5rem 4rem;
            font-size: 1.125rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            color: var(--text-light);
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1), var(--shadow);
        }

        .search-input::placeholder {
            color: var(--text-gray);
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
            pointer-events: none;
        }

        .search-button {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.75rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-button:hover {
            background: var(--primary-dark);
            transform: translateY(-50%) scale(1.05);
        }

        .search-button:active {
            transform: translateY(-50%) scale(0.98);
        }

        /* Stats */
        .stats {
            display: flex;
            gap: 3rem;
            margin-top: 3rem;
            animation: fadeInUp 1s ease 0.6s backwards;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            display: block;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-gray);
            margin-top: 0.25rem;
        }

        /* Floating Keywords */
        .floating-keywords {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .keyword {
            position: absolute;
            padding: 0.5rem 1rem;
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.2);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-gray);
            animation: float 20s infinite ease-in-out;
            opacity: 0;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                opacity: 0;
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            50% {
                transform: translateY(-100px) translateX(50px) rotate(5deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .search-input {
                font-size: 1rem;
                padding: 1.25rem 3rem 1.25rem 3rem;
            }

            .stats {
                flex-direction: column;
                gap: 1.5rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas 3D -->
    <canvas id="canvas3d"></canvas>

    <!-- Floating Keywords -->
    <div class="floating-keywords" id="floatingKeywords"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo -->
        <h1 class="logo">JOBMATCH</h1>
        <p class="tagline">Find Your Perfect Healthcare Job</p>

        <!-- Search -->
        <div class="search-container">
            <div class="search-wrapper">
                <i data-lucide="search" class="search-icon" width="24" height="24"></i>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Search: registered nurse, physical therapist, cna..."
                    autocomplete="off"
                >
                <button class="search-button" id="searchButton">
                    <span>Search</span>
                    <i data-lucide="arrow-right" width="20" height="20"></i>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-item">
                <span class="stat-value">1,998</span>
                <span class="stat-label">Healthcare Jobs</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">230ms</span>
                <span class="stat-label">Avg Search Time</span>
            </div>
            <div class="stat-item">
                <span class="stat-value">You need a job? </span>
                <span class="stat-label">You're in </span>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // ====================================================================
        // FLOATING KEYWORDS
        // ====================================================================
        
        const keywords = [
            'Registered Nurse', 'Physical Therapist', 'CNA', 'Medical Assistant',
            'Occupational Therapist', 'Physician', 'Nurse Practitioner', 
            'Emergency', 'ICU', 'Telemetry', 'Surgery', 'Pediatric',
            'Home Health', 'Travel Nurse', 'PRN', 'Full Time', 'Part Time', 'Dentist', 'Pharmacist', 'Radiologic Technologist', 
            'Respiratory Therapist', 'Medical Technologist', 'Lab Technician', 'Mental Health', 
            'Psychiatrist', 'Psychologist', 'Social Worker', 'Dietitian', 'Nutritionist', 
            'Speech Therapist', 'Cardiologist', 'Oncologist', 'Dermatologist'
        ];

        function createFloatingKeywords() {
            const container = document.getElementById('floatingKeywords');
            
            keywords.forEach((keyword, index) => {
                const div = document.createElement('div');
                div.className = 'keyword';
                div.textContent = keyword;
                
                // Random position
                div.style.left = Math.random() * 100 + '%';
                div.style.top = Math.random() * 100 + '%';
                
                // Random delay
                div.style.animationDelay = (index * 1.1) + 's';
                
                container.appendChild(div);
            });
        }

        createFloatingKeywords();

        // ====================================================================
        // THREE.JS 3D BACKGROUND
        // ====================================================================
        
        const canvas = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 5;

        // Create particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1000;
        const positions = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 10;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x2563eb,
            size: 0.02,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            particles.rotation.y += 0.001;
            particles.rotation.x += 0.0005;
            
            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ====================================================================
        // SEARCH FUNCTIONALITY
        // ====================================================================
        
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');

        function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                searchInput.focus();
                return;
            }

            // Redirect to search page with query parameter
            window.location.href = `/search?q=${encodeURIComponent(query)}`;
        }

        searchButton.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Auto-focus on load
        window.addEventListener('load', () => {
            searchInput.focus();
        });
    </script>
</body>
</html>
